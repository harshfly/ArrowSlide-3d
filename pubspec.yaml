name: arrowslide_3d
description: "ArrowSlide 3D - A premium flat-style arrow block puzzle game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.4
  provider: ^6.1.2
  google_mobile_ads: ^5.3.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/images/
    - assets/audio/

dependency_overrides:
  path_provider_foundation: 2.4.0
  shared_preferences_foundation: 2.4.0
